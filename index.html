<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O que eu tenho aprendido · Jean Barbosa</title>
<meta name="description" content="Caderno de aprendizados de Jean Barbosa: frases, pensamentos e perguntas de quem está aprendendo a anotar.">
<meta property="og:title" content="O que eu tenho aprendido · Caderno de aprendizados">
<meta property="og:description" content="Frases, pensamentos e perguntas de quem está aprendendo a anotar.">
<meta property="og:image" content="capa.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Lora:wght@500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --vinho:#5B1F2D; --creme:#F7EDE4; --ouro:#E8AF2E; --terra:#C8532A; --tinta:#2B1B20;
  }
  *{box-sizing:border-box;margin:0}
  body{
    background:var(--vinho); color:var(--creme);
    font-family:'Lora',Georgia,serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  main{
    width:100%; max-width:880px;
    display:grid; grid-template-columns:minmax(0,300px) 1fr; gap:48px; align-items:center;
  }
  .capa{
    display:block; width:100%; border-radius:6px;
    box-shadow:0 18px 40px rgba(0,0,0,.45); transform:rotate(-2deg);
    transition:transform .2s;
  }
  .capa:hover{transform:rotate(0)}
  .tag{font-family:'Poppins',sans-serif; font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--terra); font-weight:600}
  h1{font-size:clamp(34px,6vw,52px); line-height:1.08; margin:14px 0 12px}
  h1 span{color:var(--ouro)}
  .sub{font-family:'Caveat',cursive; font-size:26px; line-height:1.2; margin-bottom:30px; color:#f1dccd}
  .botoes{display:flex; flex-wrap:wrap; gap:12px}
  a.btn{
    font-family:'Poppins',sans-serif; font-size:14px; font-weight:600; text-decoration:none;
    padding:14px 24px; border-radius:999px; display:inline-block;
  }
  .ler{background:var(--ouro); color:var(--tinta)}
  .baixar{border:2px solid var(--creme); color:var(--creme)}
  .ler:hover{background:#f2c04f}
  .baixar:hover{background:var(--creme); color:var(--vinho)}
  .assinatura{margin-top:34px; font-family:'Caveat',cursive; font-size:24px; color:var(--ouro)}
  @media (max-width:720px){
    main{grid-template-columns:1fr; gap:32px; text-align:center}
    .capa{max-width:240px; margin:0 auto}
    .botoes{justify-content:center}
  }
</style>
</head>
<body>
<main>
  <a href="o-que-eu-tenho-aprendido.pdf" aria-label="Abrir o caderno em PDF">
    <img class="capa" src="capa.png" alt="Capa do caderno O que eu tenho aprendido">
  </a>
  <section>
    <p class="tag">Caderno de aprendizados · Volume 1</p>
    <h1>O que eu tenho <span>aprendido</span></h1>
    <p class="sub">frases, pensamentos e perguntas de quem está aprendendo a anotar.</p>
    <div class="botoes">
      <a class="btn ler" href="o-que-eu-tenho-aprendido.pdf">Ler online</a>
      <a class="btn baixar" href="o-que-eu-tenho-aprendido.pdf" download="O-que-eu-tenho-aprendido-Jean-Barbosa.pdf">Baixar PDF</a>
    </div>
    <p class="assinatura">Jean Barbosa</p>
  </section>
</main>
</body>
</html>
